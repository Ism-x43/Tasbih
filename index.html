<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dhikr and Tasbih– Islamic Tasbih Counter Online</title>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: radial-gradient(circle at top, #0b1a2a, #020617);
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.container {
    text-align: center;
    width: 90%;
    max-width: 400px;
}

.arabic {
    font-size: 32px;
    margin-bottom: 10px;
}

.translation {
    font-size: 14px;
    opacity: 0.7;
    margin-bottom: 20px;
}

.cycle {
    font-size: 13px;
    opacity: 0.6;
    margin-bottom: 30px;
}

.countBtn {
    width: 220px;
    height: 220px;
    border-radius: 50%;
    background: radial-gradient(circle at top, #0b1a2a, #020617);
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    border: none;
    cursor: pointer;
    box-shadow: 0 0 25px rgba(212,175,55,0.25);
}

.counter {
    font-size: 48px;
    font-weight: 700;
    color: white;
}

.resetBtn {
    margin-top: 20px;
    padding: 10px 18px;
    border-radius: 10px;
    border: none;
    background: rgba(255,255,255,0.08);
    color: white;
    cursor: pointer;
}
</style>
</head>

<body>

<div class="container">

<div class="arabic" id="dhikrArabic"></div>
<div class="translation" id="dhikrTranslation"></div>
<div class="cycle" id="cycle"></div>

<button class="countBtn" onclick="count()">
    <div class="counter" id="counter">0</div>
</button>

<div>
    <button class="resetBtn" onclick="decrease()">−</button>
    <button class="resetBtn" onclick="reset()">Reset</button>
</div>

</div>

<script>
// 🔥 CLEAN STRUCTURED PHASES (no more broken if/else)
const phases = [
    {
        arabic: "سُبْحَانَ ٱللَّٰهِ",
        translation: "Allah is Perfect • Glory be to God",
        count: 33
    },
    {
        arabic: "ٱلْحَمْدُ لِلَّٰهِ",
        translation: "All praise belongs to Allah",
        count: 33
    },
    {
        arabic: "ٱللَّٰهُ أَكْبَر",
        translation: "Allah is Greater",
        count: 33
    },
    {
        arabic: "لَا إِلَٰهَ إِلَّا ٱللَّٰهُ",
        translation: "There is no god but Allah",
        count: 100
    },
    {
        arabic: "أَسْتَغْفِرُ ٱللَّٰهَ",
        translation: "I seek forgiveness from Allah",
        count: 100
    }
];

let countValue = Number(localStorage.getItem('count')) || 0;
let phaseIndex = Number(localStorage.getItem('phaseIndex')) || 0;

update();

function count(){
    countValue++;

    if(countValue >= phases[phaseIndex].count){
        countValue = 0;
        phaseIndex = (phaseIndex + 1) % phases.length;
    }

    save();
    update();
}

function decrease(){
    if(countValue > 0){
        countValue--;
        save();
        update();
    }
}

function reset(){
    countValue = 0;
    phaseIndex = 0;
    save();
    update();
}

function save(){
    localStorage.setItem('count', countValue);
    localStorage.setItem('phaseIndex', phaseIndex);
}

function update(){
    const phase = phases[phaseIndex];

    document.getElementById("counter").innerText = countValue;
    document.getElementById("cycle").innerText = countValue + " / " + phase.count;

    document.getElementById("dhikrArabic").innerText = phase.arabic;
    document.getElementById("dhikrTranslation").innerText = phase.translation;
}
</script>

</body>
</html>
